services:
  - type: web
    name: criti-designs-website
    env: node
    # Install Git LFS pointers and build the Next app
    buildCommand: |
      git lfs install --skip-repo
      git lfs fetch
      git lfs checkout
      npm install --include=dev
      npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NODE_VERSION
        value: "20.10.0"
      - key: PORT
        value: "3000"
